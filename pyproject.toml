[project]
name = "face-recognition"
version = "0.1.0"
description = "Real-time face recognition using OpenCV LBPH and a Haar cascade detector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "opencv-contrib-python>=4.9",
]

[project.scripts]
collect = "main:main"
recognise = "faceRecognition:main"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
